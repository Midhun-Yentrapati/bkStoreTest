# Application Configuration
spring.application.name=book-catalog
server.port=8080

# Import external configuration from Config Server
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.platform=mysql
# Datasource properties externalized in Config Server

# Local fallback datasource (used if Config Server values are not applied)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Spring Data JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# Management / Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForDevelopmentOnlyMinimum32Characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Web Configuration


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
