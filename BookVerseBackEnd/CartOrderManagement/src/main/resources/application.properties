# Application Configuration
spring.application.name=cart-order-management
server.port=8083

# Import external configuration from Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Local fallback datasource (used if Config Server values are not applied)
spring.datasource.url=jdbc:mysql://localhost:3306/cart_order_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Midhun@64
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.platform=mysql

# Spring Data JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Management / Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Web Configuration


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Logging
logging.level.com.bookverse.CartOrderManagement=DEBUG
logging.level.org.springframework.beans=DEBUG

# JWT Configuration - Now managed centrally by Config Server
# JWT properties are configured in config-server/src/main/resources/config/application.yml
