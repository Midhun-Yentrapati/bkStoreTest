# Configuration specific to Book Catalogue Service
server:
  port: 8082

spring:
  application:
    name: book-catalog
  datasource:
    # MySQL Configuration for production
    url: jdbc:mysql://localhost:3306/catlog_schema
    username: root
    password: Midhun@64
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

# Book-specific Configuration
books:
  pagination:
    default-size: 20
    max-size: 100
  search:
    enabled: true
    index-refresh-interval: 300000  # 5 minutes 