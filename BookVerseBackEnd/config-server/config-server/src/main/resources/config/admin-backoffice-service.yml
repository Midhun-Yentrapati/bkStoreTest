# Configuration specific to Admin BackOffice Service
server:
  port: 8084

spring:
  security:
    user:
      name: admin
      password: admin123
  datasource:
    url: jdbc:mysql://localhost:3306/AdminService?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: vijay@2003
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  application:
    name: admin-backoffice-service
  h2:
    console:
      enabled: true
      path: /h2-console

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration is inherited from application.yml (global config)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  security:
    enabled: false

logging:
  level:
    com.bookstore2: DEBUG
    org.springframework.cloud: INFO
    org.springframework.web: INFO

# Security Configuration

# Admin-specific Configuration
admin:
  session:
    timeout: 3600000  # 1 hour
  audit:
    enabled: true
    retention-days: 90
