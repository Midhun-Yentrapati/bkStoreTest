<div class="chart-container">
  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
  </div>
  <div *ngIf="isLoading" class="loading-message">
    <p>Loading least sold books data...</p>
  </div>
  <div *ngIf="hasChartData" class="modern-chart-wrapper">
    <app-modern-pie-chart 
      [data]="chartData"
      [size]="260"
      [showCenterText]="false"
      [colors]="['#ffab91', '#f48fb1', '#ce93d8', '#b39ddb', '#9fa8da', '#90caf9']">
    </app-modern-pie-chart>
  </div>
  <div *ngIf="!isLoading && !errorMessage && !hasChartData" class="no-data-message">
    <p>No least sold books with sales data available to display.</p>
    <p>This chart shows books with the lowest sales (excluding books with 0 sales).</p>
    <p>Please ensure your data contains books with sales greater than 0.</p>
  </div>
</div>
